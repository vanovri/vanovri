cv:
  name: Ardhya Novri Ramadhan
  headline: Electrical Engineering Graduate | Embedded Systems and Python Tools
  location: Bekasi, Indonesia
  email: ardhyasan@gmail.com
  website: https://ardhyanovri.my.id
  social_networks:
  - network: LinkedIn
    username: dhya
  - network: GitHub
    username: vanovri
  sections:
    Professional Summary:
    - Electrical Engineering graduate with STM32, Python and electronics project experience. Develops AI-assisted
      tools and verifies their behavior with tests. Based in Bekasi and open to junior engineering roles across Jabodetabek
      across Jabodetabek.
    Education:
    - institution: Diponegoro University
      degree: B.Eng.
      area: Electrical Engineering
      date: Sep 2026
      highlights:
      - 'GPA: 3.43/4.00. Graduated 29 September 2026.'
    Practical Experience:
    - company: PT Angkasa Pura Indonesia
      position: Internship Trainee
      date: Jul - Aug 2025
      highlights:
      - Gained field exposure to UPS and converter systems at Soekarno-Hatta International Airport.
    - company: Redesma Technologies
      position: Electronics Technician
      date: Jan - Feb 2025
      highlights:
      - Worked on electronics tasks involving IoT temperature monitoring and DC motor control.
    Technical Skills:
    - label: Firmware and Software
      details: C, STM32 HAL, ADC/DMA, UART, digital filtering, Python/Tkinter, React, FastAPI and automated tests.
    Selected Projects:
    - name: '[RepairGate](https://github.com/vanovri/repairgate)'
      date: Oct 2026
      highlights:
      - Built a local code-repair verifier with protected tests, independent holdout checks and exported patch decisions.
        Includes an optional Ollama proposal adapter; demo uses recorded candidates.
    - name: '[ApplyProof](https://github.com/vanovri/applyproof)'
      date: Oct 2026
      highlights:
      - Built an application workspace that separates office and worksite locations, compares explicit skill tags
        against reviewed candidate facts and creates traceable drafts.
    - name: '[DataRescue](https://github.com/vanovri/datarescue)'
      date: Oct 2026
      highlights:
      - Built schema-driven CSV/JSON repair with quarantine and auditable exports; verified backend behavior and
        browser workflows.
    - name: EMG Acquisition and Python Monitoring GUI
      date: Thesis, 2026
      highlights:
      - Implemented STM32 signal acquisition, digital filtering and the full Python/Tkinter monitoring GUI with
        coding-agent assistance. Teammates handled stimulation and fuzzy control.
    Campus Leadership:
    - company: Google Student Ambassador Program
      position: Google Student Ambassador
      date: Class of 2025
      highlights:
      - Completed the student ambassador program; recognized for leadership in championing Google AI within the
        campus community.
    Selected Training:
    - label: Electrical and IoT
      details: 'Automation Clinic: Motor Protection and Control (Sep 2024); Cisco Introduction to Internet of Things
        (Sep 2026).'
